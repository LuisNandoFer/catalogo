
title: Catálogo
description: Catálogo de productos
currency: "GTQ"
baseurl: "/catalogo"
url: "https://luisnandofer.github.io"
permalink: pretty
collections:
  products:
    output: true
  categories:
    output: true
defaults:
  - scope:
      path: ""
      type: "categories"
    values:
      layout: "category"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
     