---
layout: default
title: Inicio
---

<h1>{{ site.title }}</h1>

<h2>Categorias</h2>

<ul>
  {% for category in site.data.categories %}
    <li>
      {{ category.name }}
    </li>
  {% endfor %}
</ul>

<h2>Productos</h2>

<ul>
  {% for product in site.products %}
    <li>
      {{ product.name }} - {{ product.description }}
    </li>
  {% endfor %}
</ul>
